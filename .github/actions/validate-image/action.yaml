name: Validate Docker image
description: Build, scan and smoke-test a Docker image

inputs:
  image:
    description: Local Docker image name and tag
    required: true

permissions: {}

runs:
  using: composite
  steps:
    - name: Validate image input
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        if [[ ! "$IMAGE" =~ ^[a-z0-9][a-z0-9._:/-]*$ ]]; then
          echo "::error::Invalid image reference"
          exit 1
        fi

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

    - name: Build Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
      with:
        context: .
        platforms: linux/amd64
        build-args: |
          APP_VERSION=${{ github.ref_name }}
          GIT_SHA=${{ github.sha }}
        target: runtime
        tags: ${{ inputs.image }}
        load: true

    - name: Scan with Trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
      with:
        image-ref: ${{ inputs.image }}
        trivy-config: trivy.yml
        trivyignores: .trivyignore

    - name: Start container
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        docker run -d \
          --name app-under-test \
          --read-only \
          --cap-drop=ALL \
          --security-opt=no-new-privileges \
          -p 8000:8000 \
          "$IMAGE"

    - name: Smoke tests
      shell: bash
      run: |
          for _ in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo "Health check successful!"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Health check failed!"
          docker logs ci-cd-playground
          exit 1

    - name: Cleanup
      if: always()
      shell: bash
      run: docker rm -f app-under-test || true
