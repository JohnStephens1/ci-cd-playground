name: Validate Docker image
description: Scan and smoke-test an already-built Docker image

inputs:
  image:
    description: Local Docker image name and tag
    required: true

permissions: {}

runs:
  using: composite
  steps:
    - name: Validate image input
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail

        if [[ ! "$IMAGE" =~ ^[a-z0-9][a-z0-9._:/-]*$ ]]; then
          echo "::error::Invalid image reference"
          exit 1
        fi

        if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
          echo "::error::Docker image '$IMAGE' does not exist locally"
          exit 1
        fi

    - name: Scan with Trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
      with:
        image-ref: ${{ inputs.image }}
        trivy-config: trivy.yml
        trivyignores: .trivyignore

    - name: Start container
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail

        docker run -d \
          --name app-under-test \
          --read-only \
          --cap-drop=ALL \
          --security-opt=no-new-privileges \
          -p 8000:8000 \
          "$IMAGE"

    - name: Smoke tests
      shell: bash
      run: |
        set -euo pipefail

        for _ in {1..30}; do
          if curl --fail --silent http://localhost:8000/health; then
            echo "Health check successful!"
            exit 0
          fi

          echo "Waiting for application..."
          sleep 2
        done

        echo "::error::Health check failed!"
        docker logs app-under-test
        exit 1

    - name: Cleanup
      if: always()
      shell: bash
      run: |
        docker rm -f app-under-test || true
