name: Docker Build & Publish

on:
  workflow_call:
    inputs:
      image_tag:
        description: Additional tag to publish (e.g. release tag or latest)
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  docker-publish:
    name: Build, test and publish Docker image
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate image
        uses: $/.github/actions/validate-image
        with:
          image: "ci-cd-playground:${{ github.sha }}"

      - name: Define image name
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push Docker image
        env:
          ADDITIONAL_TAG: ${{ inputs.image_tag }}
        run: |
          docker tag \
            "ci-cd-playground:${GITHUB_SHA}" \
            "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"

          if [ -n "$ADDITIONAL_TAG" ]; then
            docker tag \
              "ci-cd-playground:${GITHUB_SHA}" \
              "$IMAGE_NAME:$ADDITIONAL_TAG"
            docker push "$IMAGE_NAME:$ADDITIONAL_TAG"
          fi

      - name: Stop and remove container
        if: always()
        run: docker rm -f ci-cd-playground || true
