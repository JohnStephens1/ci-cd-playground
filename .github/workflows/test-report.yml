name: 'Test Report'

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

permissions: {}

jobs:
  report:
    name: Report tests
    permissions:
      contents: read
      actions: read
      checks: write
    runs-on: ubuntu-latest

    steps:
      - name: Publish test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        with:
          artifact: '/test-results-(.*)/'
          name: 'Pytest Results (Python $1)'
          path: '*.xml'
          reporter: python-xunit
          fail-on-empty: false
