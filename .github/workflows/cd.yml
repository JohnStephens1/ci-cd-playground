name: Continuous Delivery

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Target environment to deploy
        required: true
        type: choice
        options:
          - both
          - staging
          - production
        default: both

permissions: {}

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI Validation & Build
    permissions:
      contents: read
    uses: $/.github/workflows/ci.yml

  docker-publish:
    name: Docker Build & Publish
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    needs: [ci]
    uses: $/.github/workflows/docker-publish.yml

  deploy-staging:
    name: Deploy to Staging
    permissions:
      contents: read
      attestations: read
      packages: read
    needs: [docker-publish]
    if: github.event_name == 'push' || inputs.deploy_target == 'staging' || inputs.deploy_target == 'both'
    uses: $/.github/workflows/deploy.yml
    with:
      environment: staging
      image_digest: ${{ needs.docker-publish.outputs.image_digest }}
      expected_commit: ${{ github.sha }}

  deploy-production:
    name: Deploy to Production
    permissions:
      contents: read
      attestations: read
      packages: read
    needs: [docker-publish, deploy-staging]
    if: |
      !cancelled() &&
      needs.docker-publish.result == 'success' &&
      (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped') &&
      (github.event_name == 'push' || inputs.deploy_target == 'production' || inputs.deploy_target == 'both')
    uses: $/.github/workflows/deploy.yml
    with:
      environment: production
      image_digest: ${{ needs.docker-publish.outputs.image_digest }}
      expected_commit: ${{ github.sha }}
