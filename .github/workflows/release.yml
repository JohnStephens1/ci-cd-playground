name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). If omitted, the triggering ref is used."
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI Validation & Build
    uses: ./.github/workflows/ci.yml

  docker-publish:
    name: Build, test and publish Docker image
    needs: [ci]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Define image name
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ci-cd-playground:${GITHUB_SHA} \
            .

      - name: Start container
        run: |
          docker run -d \
            --name ci-cd-playground \
            -p 8000:8000 \
            ci-cd-playground:${GITHUB_SHA}

      - name: Test health endpoint
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo "Health check successful!"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Health check failed!"
          docker logs ci-cd-playground
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag \
            ci-cd-playground:${GITHUB_SHA} \
            "$IMAGE_NAME:${GITHUB_REF_NAME}"

          docker tag \
            ci-cd-playground:${GITHUB_SHA} \
            "$IMAGE_NAME:${GITHUB_SHA}"

      - name: Push Docker image
        run: |
          docker push "$IMAGE_NAME:${GITHUB_REF_NAME}"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"

      - name: Stop and remove container
        if: always()
        run: docker rm -f ci-cd-playground || true

  deploy-staging:
    name: Deploy to staging
    needs: docker-publish
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Trigger Render deployment
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URL="${IMAGE_NAME,,}:${IMAGE_TAG}"

          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "$(jq -n --arg image "$IMAGE_URL" \
              '{imageUrl: $image}')")

          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.id')

          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" = "null" ]; then
            echo "Could not retrieve deployment ID."
            echo "$RESPONSE"
            exit 1
          fi

          echo "Deployment started: $DEPLOY_ID"
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: |
          for i in {1..60}; do
            RESPONSE=$(curl --fail-with-body --silent --show-error \
              --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              --header "Authorization: Bearer ${RENDER_API_KEY}")

            STATUS=$(echo "$RESPONSE" | jq -r '.status')

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "live" ]; then
              echo "Deployment completed successfully."
              exit 0
            fi

            case "$STATUS" in
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Deployment failed with status: $STATUS"
                exit 1
                ;;
            esac

            sleep 30
          done

          echo "Timed out waiting for Render deployment."
          exit 1

      - name: Verify staging health
        env:
          STAGING_URL: https://ci-cd-playground-rxcn.onrender.com
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error \
              "$STAGING_URL/health"; then
              echo "Staging health check successful."
              exit 0
            fi

            echo "Waiting for staging to become healthy..."
            sleep 10
          done

          echo "Staging health check failed."
          exit 1

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [ci]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/
    permissions:
      id-token: write # Required for Trusted Publishing (OIDC)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Download built packages from CI
        uses: actions/download-artifact@v7
        with:
          name: dist-packages
          path: dist/

      - name: Publish to TestPyPI
        run: |
          uv publish --index testpypi

  release:
    name: Create GitHub Release
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Resolve release tag
        id: resolve-tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Compare tag with package version in pyproject.toml
          PROJECT_VERSION="$(uv version --short)"
          echo "Detected project version: $PROJECT_VERSION"
          echo "Target release tag: $TAG"

          if [ "$TAG" != "v$PROJECT_VERSION" ]; then
            echo "::warning::Release tag '$TAG' does not match project version 'v$PROJECT_VERSION' in pyproject.toml"
          fi

      - name: Download built packages from CI
        uses: actions/download-artifact@v7
        with:
          name: dist-packages
          path: dist/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.resolve-tag.outputs.tag }}"
          gh release create "$TAG" \
            dist/* \
            --title "Release $TAG" \
            --generate-notes
