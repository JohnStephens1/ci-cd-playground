name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to release"
        required: true
        type: string
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-reference:
    name: Validate release reference
    permissions:
      contents: read
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      sha: ${{ steps.validate.outputs.sha }}

    steps:
      - name: Checkout target commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
          python-version: "3.13"

      - name: Validate release tag and commit
        id: validate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail

          # Resolve release references.
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="$PUSH_TAG"
            sha="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            sha="$INPUT_SHA"
          else
            echo "::error::Unsupported release event: $EVENT_NAME"
            exit 1
          fi

          # Require both references.
          [[ -n "$tag" ]] || {
            echo "::error::Release tag is missing"
            exit 1
          }

          [[ -n "$sha" ]] || {
            echo "::error::Commit SHA is missing"
            exit 1
          }

          # Validate tag format.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $tag"
            exit 1
          fi

          # Validate SHA format.
          if [[ ! "$sha" =~ ^([0-9a-fA-F]{40})$ ]]; then
            echo "::error::Invalid commit SHA: $sha"
            exit 1
          fi

          # Normalize and verify the target commit.
          sha="$(git rev-parse --verify "${sha}^{commit}")"

          # Ensure the tag exists and resolves to a commit.
          tag_sha="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"

          # Verify tag and supplied SHA reference the same commit.
          if [[ "$tag_sha" != "$sha" ]]; then
            echo "::error::Tag $tag resolves to $tag_sha, not $sha"
            exit 1
          fi

          project_version="$(uv version --short)"

          if [[ -z "$project_version" ]]; then
            echo "::error::Unable to determine project version from pyproject.toml"
            exit 1
          fi

          expected_tag="v${project_version}"

          if [[ "$tag" != "$expected_tag" ]]; then
            echo "::error::Tag $tag does not match project version $expected_tag"
            exit 1
          fi

          # Export validated references.
          {
            echo "tag=$tag"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

          echo "Validated release: $tag ($sha)"

  build:
    name: Build & Attest Package (SLSA Level 3)
    needs: [validate-release-reference]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: $/.github/workflows/package-build.yml
    with:
      ref: ${{ needs.validate-release-reference.outputs.sha }}

  test-distributions:
    name: Test built distributions
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
          python-version: "3.13"

      - name: Download built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist-packages
          path: dist/

      - name: Create isolated wheel test environment
        run: uv venv .venv-wheel

      - name: Install built wheel
        run: uv pip install --python .venv-wheel/bin/python dist/*.whl

      - name: Verify wheel installation and import
        run: |
          .venv-wheel/bin/python - <<'PY'
          import ci_cd_playground
          print('Wheel installation successful:', ci_cd_playground.hello())
          PY

      - name: Create isolated sdist test environment
        run: uv venv .venv-sdist

      - name: Install built source distribution
        run: uv pip install --python .venv-sdist/bin/python dist/*.tar.gz

      - name: Verify sdist installation and import
        run: |
          .venv-sdist/bin/python - <<'PY'
          import ci_cd_playground
          print('Sdist installation successful:', ci_cd_playground.hello())
          PY

  verify:
    name: Verify artifacts, provenance, and SBOM attestations
    runs-on: ubuntu-latest
    needs: [validate-release-reference, build, test-distributions]
    permissions:
      contents: read
      attestations: read

    steps:
      - name: Download built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist-packages
          path: dist/

      - name: Download SBOM packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom-packages
          path: sbom/

      - name: Download attestation packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: attestation-packages
          path: attestations/

      - name: Download checksum packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: checksum-packages
          path: checksums/

      - name: Verify SHA-256 checksums and artifact identity
        env:
          EXPECTED_WHEEL_NAME: ${{ needs.build.outputs.wheel_name }}
          EXPECTED_WHEEL_DIGEST: ${{ needs.build.outputs.wheel_digest }}
          EXPECTED_SDIST_NAME: ${{ needs.build.outputs.sdist_name }}
          EXPECTED_SDIST_DIGEST: ${{ needs.build.outputs.sdist_digest }}
        run: |
          set -euo pipefail

          echo "Verifying SHA256SUMS file..."
          (cd dist && sha256sum -c ../checksums/SHA256SUMS)

          echo "Verifying wheel identity..."
          actual_wheel_digest="sha256:$(sha256sum "dist/${EXPECTED_WHEEL_NAME}" | awk '{print $1}')"
          if [[ "$actual_wheel_digest" != "$EXPECTED_WHEEL_DIGEST" ]]; then
            echo "::error::Wheel digest mismatch: expected $EXPECTED_WHEEL_DIGEST, got $actual_wheel_digest"
            exit 1
          fi

          echo "Verifying sdist identity..."
          actual_sdist_digest="sha256:$(sha256sum "dist/${EXPECTED_SDIST_NAME}" | awk '{print $1}')"
          if [[ "$actual_sdist_digest" != "$EXPECTED_SDIST_DIGEST" ]]; then
            echo "::error::Sdist digest mismatch: expected $EXPECTED_SDIST_DIGEST, got $actual_sdist_digest"
            exit 1
          fi

          echo "Artifact integrity and identity verified successfully."

      - name: Verify provenance and SBOM attestations (Online & Offline)
        env:
          GH_TOKEN: ${{ github.token }}
          WHEEL_NAME: ${{ needs.build.outputs.wheel_name }}
          SDIST_NAME: ${{ needs.build.outputs.sdist_name }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/package-build.yml
        run: |
          set -euo pipefail

          echo "1. Verifying SLSA build provenance via GitHub API..."
          gh attestation verify "dist/${WHEEL_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${SIGNER_WORKFLOW}"

          gh attestation verify "dist/${SDIST_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${SIGNER_WORKFLOW}"

          echo "2. Verifying individual SBOM attestations via GitHub API..."
          gh attestation verify "dist/${WHEEL_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${SIGNER_WORKFLOW}" \
            --predicate-type https://spdx.dev/Document/v2.3

          gh attestation verify "dist/${SDIST_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${SIGNER_WORKFLOW}" \
            --predicate-type https://spdx.dev/Document/v2.3

          echo "3. Verifying offline provenance bundles..."
          gh attestation verify "dist/${WHEEL_NAME}" \
            --bundle attestations/package-provenance.intoto.jsonl \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${SIGNER_WORKFLOW}"

          gh attestation verify "dist/${SDIST_NAME}" \
            --bundle attestations/package-provenance.intoto.jsonl \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${SIGNER_WORKFLOW}"

          echo "4. Verifying offline individual SBOM attestation bundles..."
          gh attestation verify "dist/${WHEEL_NAME}" \
            --bundle attestations/package-wheel-sbom.attestation.json \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${SIGNER_WORKFLOW}" \
            --predicate-type https://spdx.dev/Document/v2.3

          gh attestation verify "dist/${SDIST_NAME}" \
            --bundle attestations/package-sdist-sbom.attestation.json \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${SIGNER_WORKFLOW}" \
            --predicate-type https://spdx.dev/Document/v2.3

          echo "All cryptographic attestations and signatures verified successfully."

      - name: Validate SBOM contents and distribution association
        run: |
          set -euo pipefail

          echo "Validating SPDX JSON schemas and package association..."
          for sbom in sbom/package-wheel.spdx.json sbom/package-sdist.spdx.json; do
            [[ -s "$sbom" ]] || {
              echo "::error::SBOM $sbom is empty or missing"
              exit 1
            }
            jq -e '.spdxVersion and .packages and .name' "$sbom" > /dev/null
          done

          for readable in sbom/package-wheel.txt sbom/package-sdist.txt; do
            [[ -s "$readable" ]] || {
              echo "::error::Human-readable SBOM $readable is empty or missing"
              exit 1
            }
          done

          echo "SBOM files validated."

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [validate-release-reference, build, test-distributions, verify]
    permissions:
      contents: read
      id-token: write  # Required for Trusted Publishing (OIDC)
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
          python-version: "3.13"

      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist-packages
          path: dist/

      - name: Publish to TestPyPI
        run: |
          uv publish \
            --publish-url https://test.pypi.org/legacy/ \
            --check-url https://test.pypi.org/simple/

      - name: Smoke-test installation from TestPyPI
        env:
          TAG: ${{ needs.validate-release-reference.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          uv venv .venv-smoke

          # Wait for TestPyPI index to propagate and install package
          installed=0
          for attempt in {1..20}; do
            if uv pip install \
              --python .venv-smoke/bin/python \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "ci-cd-playground==${VERSION}"; then
              installed=1
              break
            fi
            echo "Waiting for TestPyPI index propagation (attempt $attempt/20)..."
            sleep 6
          done

          if [[ "$installed" -ne 1 ]]; then
            echo "::error::Failed to install package from TestPyPI"
            exit 1
          fi

          .venv-smoke/bin/python - <<'PY'
          import ci_cd_playground
          print("TestPyPI smoke-test successful:", ci_cd_playground.hello())
          PY

  publish-pypi:
    name: Publish to PyPI
    needs: [validate-release-reference, build, test-distributions, verify, publish-testpypi]
    permissions:
      contents: read
      id-token: write  # Required for Trusted Publishing (OIDC)
      attestations: write
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ci-cd-playground/

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
          python-version: "3.13"

      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist-packages
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a  # v0.0.7

      - name: Publish to PyPI
        run: |
          uv publish

  release:
    name: Create GitHub Release
    permissions:
      contents: write
    needs: [validate-release-reference, build, test-distributions, verify, publish-pypi]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate-release-reference.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist-packages
          path: dist/

      - name: Download SBOM packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom-packages
          path: sbom/

      - name: Download attestation packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: attestation-packages
          path: attestations/

      - name: Download checksum packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: checksum-packages
          path: checksums/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate-release-reference.outputs.tag }}
        run: |
          gh release create "$TAG" \
            dist/* \
            sbom/* \
            attestations/* \
            checksums/* \
            --title "Release $TAG" \
            --generate-notes
