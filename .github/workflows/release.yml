name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). If omitted, the triggering ref is used."
        required: false
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI Validation & Build
    permissions:
      contents: read
    uses: $/.github/workflows/ci.yml

  docker-publish:
    name: Tag & Publish Release Container
    permissions:
      contents: read
      packages: write
    needs: [ci]
    uses: $/.github/workflows/docker-publish.yml
    with:
      image_tag: ${{ inputs.tag || github.ref_name }}

  publish-testpypi:
    name: Publish to TestPyPI
    permissions:
      contents: read
      id-token: write  # Required for Trusted Publishing (OIDC)
    needs: [ci]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Download built packages from CI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist-packages
          path: dist/

      - name: Publish to TestPyPI
        run: |
          uv publish --index testpypi

  release:
    name: Create GitHub Release
    permissions:
      contents: write
    needs: [ci, docker-publish, publish-testpypi]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Resolve release tag
        id: resolve-tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Compare tag with package version in pyproject.toml
          PROJECT_VERSION="$(uv version --short)"
          echo "Detected project version: $PROJECT_VERSION"
          echo "Target release tag: $TAG"

          if [ "$TAG" != "v$PROJECT_VERSION" ]; then
            echo "::warning::Release tag '$TAG' does not match project version 'v$PROJECT_VERSION' in pyproject.toml"
          fi

      - name: Download built packages from CI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist-packages
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi
          gh release create "$TAG" \
            dist/* \
            --title "Release $TAG" \
            --generate-notes
