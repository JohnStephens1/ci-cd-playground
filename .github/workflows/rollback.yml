name: Rollback

on:
  workflow_call:
    inputs:
      service_url:
        type: string
        required: true
      deploy_id:
        type: string
        required: true
    secrets:
      RENDER_API_KEY:
        required: true
      SERVICE_ID:
        required: true

permissions: {}

concurrency:
  group: rollback
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Roll back production
        env:
          SERVICE_URL: ${{ inputs.service_url }}
          DEPLOY_ID: ${{ inputs.deploy_id }}
          SERVICE_ID: ${{ secrets.service_id }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail

          API="https://api.render.com/v1"

          request() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              "$@"
          }

          echo "Rolling back to $DEPLOY_ID"

          RESPONSE=$(request -X POST \
            "$API/services/$SERVICE_ID/rollback" \
            -d "{\"deployId\":\"$DEPLOY_ID\"}")

          ROLLBACK_ID=$(echo "$RESPONSE" | jq -r '.id')

          if [ -z "$ROLLBACK_ID" ] || [ "$ROLLBACK_ID" = "null" ]; then
            echo "Could not obtain rollback deployment ID."
            exit 1
          fi

          echo "Rollback deployment: $ROLLBACK_ID"

          for _ in $(seq 1 60); do
            DEPLOY=$(request \
              "$API/services/$SERVICE_ID/deploys/$ROLLBACK_ID")

            STATUS=$(echo "$DEPLOY" | jq -r '.status')

            echo "Rollback status: $STATUS"

            case "$STATUS" in
              live)
                echo "Rollback live."
                ;;
              build_failed|update_failed|canceled|pre_deploy_failed)
                echo "Rollback failed: $STATUS"
                exit 1
                ;;
            esac

            sleep 10
          done

          for _ in {1..30}; do
            if ! curl --fail --silent --show-error \
              "$SERVICE_URL/health"; then
              echo "Waiting for service health..."
              sleep 5
            else
              echo "Rollback completed successfully."
              exit 0
            fi
          done

          echo "Rollback timed out."
          exit 1
