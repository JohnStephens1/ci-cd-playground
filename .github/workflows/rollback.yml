name: Rollback

on:
  workflow_call:
    inputs:
      deploy_id:
        type: string
        required: true
      environment:
        description: Target deployment environment (staging or production)
        required: true
        type: string
    secrets:
      RENDER_API_KEY:
        required: true

permissions: {}

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}

    concurrency:
      group: rollback-${{ github.repository }}-${{ vars.RENDER_SERVICE_URL }}
      cancel-in-progress: false

    steps:
      - name: Validate deployment inputs
        shell: bash
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          case "$TARGET_ENV" in
            staging|production)
              ;;
            *)
              echo "::error::Invalid deployment environment: $TARGET_ENV"
              exit 1
              ;;
          esac

      - name: Roll back ${{ inputs.environment }}
        env:
          DEPLOY_ID: ${{ inputs.deploy_id }}
          SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
          SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail

          API="https://api.render.com/v1"

          request() {
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              "$@"
          }

          echo "Rolling back to ${DEPLOY_ID}"

          RESPONSE=$(request -X POST \
            "${API}/services/${SERVICE_ID}/rollback" \
            -d "$(jq -n --arg deployId "${DEPLOY_ID}" \
              '{deployId: $deployId}')")

          ROLLBACK_ID=$(printf '%s' "$RESPONSE" | jq -r '.id')

          if [[ -z "$ROLLBACK_ID" || "$ROLLBACK_ID" == "null" ]]; then
            echo "Could not obtain rollback deployment ID."
            exit 1
          fi

          echo "Rollback deployment: ${ROLLBACK_ID}"

          for ((i = 0; i < 60; i++)); do
            DEPLOY=$(request \
              "${API}/services/${SERVICE_ID}/deploys/${ROLLBACK_ID}")

            STATUS=$(printf '%s' "$DEPLOY" | jq -r '.status')

            echo "Rollback status: ${STATUS}"

            case "$STATUS" in
              live)
                echo "Rollback live."
                exit 0
                ;;
              created|queued|build_in_progress|update_in_progress|pre_deploy_in_progress)
                echo "Deploy in progress..."
                ;;
              *)
                echo "Rollback failed: ${STATUS}"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Rollback timed out."
          exit 1

      - name: Health check
        env:
          SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          set -o pipefail

          for _ in {1..10}; do
            if curl --fail --silent --show-error \
                --connect-timeout 5 \
                --max-time 10 \
                "$SERVICE_URL/health" | jq -e '.status == "ok"' > /dev/null; then

                echo "Health check OK"
                exit 0
            fi

            echo "Waiting for service health..."
            sleep 5
          done

          echo "Health check FAILED"
          exit 1
