name: Deploy Service

on:
  workflow_call:
    inputs:
      environment:
        description: Target deployment environment (staging or production)
        required: true
        type: string
      image_digest:
        description: Docker image digest to deploy
        required: true
        type: string
      expected_commit:
        description: Expected git commit SHA
        required: false
        type: string
        default: ""
      force_health_check_failure:
        description: 'Simulate health-check failure to test rollback'
        required: false
        type: boolean
        default: false
    secrets:
      RENDER_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: Target deployment environment (staging or production)
        required: true
        type: string
      image_digest:
        description: Docker image digest to deploy
        required: true
        type: string
      expected_commit:
        description: Expected git commit SHA
        required: false
        type: string
        default: ""
      force_health_check_failure:
        description: 'Simulate health-check failure to test rollback'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: deploy-${{ github.repository }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
      attestations: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: ${{ inputs.environment }}

    outputs:
      deployment_live: ${{ steps.deploying.outputs.deployment_live }}
      previous_deploy_id: ${{ steps.previous_deploy_id.outputs.previous_deploy_id }}
      health_check: ${{ steps.check.outcome }}

    steps:
      - name: Validate deployment inputs
        shell: bash
        env:
          TARGET_ENV: ${{ inputs.environment }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail

          case "$TARGET_ENV" in
            staging|production)
              ;;
            *)
              echo "::error::Invalid deployment environment: $TARGET_ENV"
              exit 1
              ;;
          esac

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid image digest."
            exit 1
          fi

      - name: Verify SLSA provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail

          IMAGE_URL="${IMAGE_NAME,,}@${IMAGE_DIGEST}"

          gh attestation verify \
            "oci://${IMAGE_URL}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/docker-publish.yml" \
            --source-ref "refs/heads/main"

      - name: Verify SBOM attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail

          IMAGE_URL="${IMAGE_NAME,,}@${IMAGE_DIGEST}"

          gh attestation verify \
            "oci://${IMAGE_URL}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/docker-publish.yml" \
            --source-ref "refs/heads/main" \
            --predicate-type https://spdx.dev/Document/v2.3

      - name: Get previous live deployment ID
        id: previous_deploy_id
        shell: bash
        env:
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${RENDER_API_KEY}" ]]; then
            echo "::error::RENDER_API_KEY is empty or unavailable"
            exit 1
          fi

          if [[ -z "${RENDER_SERVICE_ID}" ]]; then
            echo "::error::RENDER_SERVICE_ID is empty or unavailable"
            exit 1
          fi

          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --max-time 20 \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=20" \
            -H "Authorization: Bearer ${RENDER_API_KEY}")

          CURRENT_DEPLOY_ID=$(jq -r \
            '[.[] | .deploy | select(.status == "live")][0].id // empty' \
            <<< "$RESPONSE")

          if [[ -z "$CURRENT_DEPLOY_ID" ]]; then
            echo "No previous live deployment found. This may be the first deployment."
          else
            echo "Previous live deployment: $CURRENT_DEPLOY_ID"
          fi

          echo "previous_deploy_id=$CURRENT_DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deployment
        id: deploy
        shell: bash
        env:
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail

          IMAGE_URL="${IMAGE_NAME,,}@${IMAGE_DIGEST}"

          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --max-time 30 \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "$(jq -n --arg image "$IMAGE_URL" \
              '{imageUrl: $image}')")

          DEPLOY_ID=$(jq -r '.id // empty' <<< "$RESPONSE")

          if [[ -z "$DEPLOY_ID" ]]; then
            echo "::error::Could not retrieve deployment ID."
            echo "$RESPONSE"
            exit 1
          fi

          echo "Deployment started: $DEPLOY_ID"
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Render deployment
        id: deploying
        shell: bash
        env:
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: |
          set -euo pipefail

          MAX_ATTEMPTS=120
          SLEEP_SECONDS=5

          for ((i=1; i<=MAX_ATTEMPTS; i++)); do

            if ! RESPONSE=$(curl --fail-with-body --silent --show-error \
              --max-time 20 \
              --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              --header "Authorization: Bearer ${RENDER_API_KEY}"); then

              echo "Could not retrieve deployment status. Retrying..."
              sleep "$SLEEP_SECONDS"
              continue
            fi

            STATUS=$(jq -r '.status // empty' <<< "$RESPONSE") || STATUS=""

            echo "Deployment status: ${STATUS:-unknown} ($i/$MAX_ATTEMPTS)"

            if [[ "$STATUS" == "live" ]]; then
              echo "Deployment completed successfully."
              echo "deployment_live=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            case "$STATUS" in
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Deployment failed with status: $STATUS"
                exit 1
                ;;
            esac

            sleep "$SLEEP_SECONDS"
          done

          echo "::error::Timed out waiting for Render deployment."
          exit 1

      - name: Verify service health and version
        id: check
        shell: bash
        env:
          SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
          EXPECTED_SHA: ${{ inputs.expected_commit || github.sha }}
          FORCE_HEALTH_CHECK_FAILURE: ${{ inputs.force_health_check_failure }}
        run: |
          set -euo pipefail

          # Temporary rollback testing hook
          if [[ "${FORCE_HEALTH_CHECK_FAILURE:-false}" == "true" ]]; then
              echo "Simulating health-check failure"
              exit 1
          fi

          SERVICE_URL="${SERVICE_URL%/}"

          MAX_ATTEMPTS=30
          SLEEP_SECONDS=10

          for ((i=1; i<=MAX_ATTEMPTS; i++)); do

            echo "Health check attempt $i/$MAX_ATTEMPTS"

            # Verify HTTP response and application health.
            if ! HEALTH_RESPONSE=$(curl --fail --silent --show-error \
              --max-time 10 \
              "$SERVICE_URL/health"); then

              echo "Health endpoint unavailable. Retrying..."
              sleep "$SLEEP_SECONDS"
              continue
            fi

            # Require the exact expected health status.
            if ! jq -e '.status == "ok"' <<< "$HEALTH_RESPONSE" >/dev/null; then
              echo "Health endpoint returned an unexpected response:"
              echo "$HEALTH_RESPONSE"
              sleep "$SLEEP_SECONDS"
              continue
            fi

            echo "Health check passed."

            # Verify the deployed application version.
            if ! VERSION_RESPONSE=$(curl --fail --silent --show-error \
              --max-time 10 \
              "$SERVICE_URL/version"); then

              echo "Version endpoint unavailable. Retrying..."
              sleep "$SLEEP_SECONDS"
              continue
            fi

            ACTUAL_SHA=$(jq -r '.commit // empty' <<< "$VERSION_RESPONSE") || ACTUAL_SHA=""

            if [[ -z "$ACTUAL_SHA" ]]; then
              echo "Version endpoint returned no commit SHA."
              sleep "$SLEEP_SECONDS"
              continue
            fi

            if [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]]; then
              echo "Service is running the expected version: $ACTUAL_SHA"
              exit 0
            fi

            echo "Commit mismatch."
            echo "Expected: $EXPECTED_SHA"
            echo "Actual:   $ACTUAL_SHA"

            sleep "$SLEEP_SECONDS"
          done

          echo "::error::Service verification failed."
          exit 1

  rollback:
    name: Rollback failed deployment
    needs: deploy
    if: |
      always() &&
      needs.deploy.result == 'failure' &&
      needs.deploy.outputs.deployment_live == 'true' &&
      needs.deploy.outputs.health_check == 'failure' &&
      needs.deploy.outputs.previous_deploy_id != ''
    uses: $/.github/workflows/rollback.yml
    with:
      deploy_id: ${{ needs.deploy.outputs.previous_deploy_id }}
      environment: ${{ inputs.environment }}
    secrets:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
